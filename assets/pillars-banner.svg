<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" fill="none" role="img" aria-label="Core Engineering Pillars">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <!-- Pillar 1: Full-Stack & Scalable SaaS -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="286" height="182" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="22" y="22" width="42" height="3.5" rx="1.75" fill="#5EEAD4"/>
    <text x="264" y="28" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#5EEAD4">01</text>
    <text x="22" y="60" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">Full-Stack &amp; SaaS</text>
    <text x="22" y="86" class="sans" font-size="12.5" fill="#94A3B8">Scalable end-to-end web apps,</text>
    <text x="22" y="104" class="sans" font-size="12.5" fill="#94A3B8">clean APIs, RBAC &amp; 3D UIs.</text>
    <line x1="22" y1="128" x2="264" y2="128" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="154" class="mono" font-size="11" fill="#CBD5E1">Next.js · Spring Boot · NestJS</text>
  </g>

  <!-- Pillar 2: AI & Automation -->
  <g transform="translate(306, 4)">
    <rect x="0" y="0" width="286" height="182" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="22" y="22" width="42" height="3.5" rx="1.75" fill="#38BDF8"/>
    <text x="264" y="28" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">02</text>
    <text x="22" y="60" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">AI &amp; Automation</text>
    <text x="22" y="86" class="sans" font-size="12.5" fill="#94A3B8">Multi-agent LangGraph flows,</text>
    <text x="22" y="104" class="sans" font-size="12.5" fill="#94A3B8">on-device vision &amp; CV tooling.</text>
    <line x1="22" y1="128" x2="264" y2="128" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="154" class="mono" font-size="11" fill="#CBD5E1">LangGraph · ONNX · MediaPipe</text>
  </g>

  <!-- Pillar 3: CRM & Client Platforms -->
  <g transform="translate(610, 4)">
    <rect x="0" y="0" width="286" height="182" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="22" y="22" width="42" height="3.5" rx="1.75" fill="#F59E0B"/>
    <text x="264" y="28" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#F59E0B">03</text>
    <text x="22" y="60" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">CRM &amp; Client Systems</text>
    <text x="22" y="86" class="sans" font-size="12.5" fill="#94A3B8">DreamWay Consulting delivery,</text>
    <text x="22" y="104" class="sans" font-size="12.5" fill="#94A3B8">QR workflows &amp; admin portals.</text>
    <line x1="22" y1="128" x2="264" y2="128" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="154" class="mono" font-size="11" fill="#CBD5E1">PostgreSQL · Prisma · Stripe</text>
  </g>

  <!-- Pillar 4: QA & Reliability -->
  <g transform="translate(914, 4)">
    <rect x="0" y="0" width="284" height="182" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="22" y="22" width="42" height="3.5" rx="1.75" fill="#A78BFA"/>
    <text x="262" y="28" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#A78BFA">04</text>
    <text x="22" y="60" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">QA &amp; Reliability</text>
    <text x="22" y="86" class="sans" font-size="12.5" fill="#94A3B8">Automated validation suites,</text>
    <text x="22" y="104" class="sans" font-size="12.5" fill="#94A3B8">false-positive &amp; E2E testing.</text>
    <line x1="22" y1="128" x2="262" y2="128" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="154" class="mono" font-size="11" fill="#CBD5E1">Jest · Validation · Docker</text>
  </g>
</svg>
